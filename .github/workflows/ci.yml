name: Core contracts and build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Bootstrap iteration: lockfile cannot be generated in the isolated workspace.
      # Replace npm install with npm ci as soon as package-lock.json has been generated.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Contract tests
        run: npm test
      - name: App type checks
        run: npm run typecheck
      - name: Build client and server
        run: npm run build
